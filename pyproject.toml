[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peleng3d"
version = "0.1.0"
description = "Local stereo 3D tracking with macOS and an iPhone camera"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "opencv-python>=4.9,<5", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.package-data]
peleng3d = []

[tool.pytest.ini_options]
testpaths = ["tests"]
